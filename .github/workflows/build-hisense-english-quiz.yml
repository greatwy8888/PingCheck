name: Build Hisense English Quiz APK
run-name: Build Hisense English Quiz APK
'on':
  workflow_dispatch:
  push:
    branches:
      - hisense-english-quiz

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Android SDK paths
        shell: bash
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Set Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools and SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set Java 11 for Gradle 6.7.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download Gradle 6.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-6.7.1-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: hisense-english-quiz
        shell: bash
        run: |
          "$RUNNER_TEMP/gradle-6.7.1/bin/gradle" assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -s hisense-english-quiz/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-English-Quiz-debug-apk
          path: hisense-english-quiz/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

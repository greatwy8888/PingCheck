name: Build Hisense English Quiz APK
on:
  workflow_dispatch:
  push:
    branches: [ hisense-english-quiz ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Download Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-6.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        working-directory: hisense-english-quiz
        run: /tmp/gradle-6.7.1/bin/gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Hisense-English-Quiz-debug-apk
          path: hisense-english-quiz/app/build/outputs/apk/debug/app-debug.apk
